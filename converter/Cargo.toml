[package]
name = "blackfox-skp"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "BlackFox SKP native SketchUp importer and exporter"

[[bin]]
name = "BlackFoxSKP"
path = "src/main.rs"

[dependencies]
skpwright = { path = "skpwright/crates/skpwright" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
